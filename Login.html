<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · ตู้รับคืนขวดพลาสติก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:#248e50; --green-dark:#1d8247; --teal:#199f4f;
  --forest:#1B4332; --moss:#40916C; --fern:#52B788;
  --cream:#F0FAF3; --white:#FEFEFE; --ink:#1A2820;
  --mid:#3D5A4C; --soft:#7A9E8E; --mist:#B7E4C7; --foam:#D8F3DC;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e8f5e9,#f0faf3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px;
}
 
.phone{
  width:375px;
  min-height:720px;
  background:var(--white);
  border-radius:42px;
  box-shadow:0 24px 64px rgba(0,0,0,0.18),0 2px 8px rgba(0,0,0,0.08);
  overflow:hidden;
  display:flex;flex-direction:column;
  border:6px solid #d1d5db;
  position:relative;
}
 
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px 6px;
  font-size:12px;font-weight:700;color:var(--forest);
  position:relative;z-index:10;
}
 
.login-hero{
  background:linear-gradient(160deg,#e8f8f0 0%,#f0faf5 50%,#fff 100%);
  padding:16px 24px 0;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
 
.logo-area{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.logo-icon{
  width:38px;height:38px;
  background:linear-gradient(135deg,var(--green),var(--teal));
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 4px 12px rgba(46,204,113,0.35);
}
.logo-text{font-family:'Mitr',sans-serif;font-size:18px;font-weight:700;color:var(--green-dark);}
 
.hero-illustration{
  width:100%;max-width:280px;height:150px;position:relative;margin:0 auto;
}
.hero-blob{
  position:absolute;width:170px;height:170px;
  background:linear-gradient(135deg,rgba(46,204,113,0.18),rgba(26,188,156,0.12));
  border-radius:60% 40% 70% 30%/50% 60% 40% 50%;
  top:-20px;left:50%;transform:translateX(-50%);
  animation:blobMorph 6s ease-in-out infinite;
}
@keyframes blobMorph{
  0%,100%{border-radius:60% 40% 70% 30%/50% 60% 40% 50%;}
  50%{border-radius:40% 60% 30% 70%/60% 40% 60% 40%;}
}
.bottle-float{position:absolute;font-size:26px;animation:float 3s ease-in-out infinite;}
.bottle-float:nth-child(2){left:16px;top:10px;animation-delay:0s;}
.bottle-float:nth-child(3){right:24px;top:5px;animation-delay:1s;}
.bottle-float:nth-child(4){left:8px;top:76px;animation-delay:.5s;font-size:20px;}
.bottle-float:nth-child(5){right:8px;top:86px;animation-delay:1.5s;font-size:20px;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-10px) rotate(5deg);}}
.hero-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;}
.hero-title{font-family:'Mitr',sans-serif;font-size:17px;font-weight:700;line-height:1.5;}
.hero-title .w1{color:var(--green-dark);}
.hero-title .w2{color:var(--teal);}
 
.form-wrap{
  flex:1;padding:16px 24px 24px;
  display:flex;flex-direction:column;gap:13px;
}
 
.uni-badge{
  display:flex;align-items:center;gap:10px;
  background:var(--foam);border-radius:12px;padding:10px 14px;
  border:1px solid var(--mist);
}
.uni-badge-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--forest),var(--moss));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.uni-badge-text .t{font-family:'Mitr',sans-serif;font-size:12px;font-weight:700;color:var(--forest);}
.uni-badge-text .s{font-size:11px;color:var(--soft);}
.eco-chip{margin-left:auto;background:var(--fern);color:#fff;font-family:'Mitr',sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;}
 
.welcome{text-align:center;}
.welcome h2{font-family:'Mitr',sans-serif;font-size:19px;font-weight:600;color:var(--ink);}
.welcome p{font-size:13px;color:var(--soft);margin-top:2px;}
 
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:13px;font-weight:600;color:var(--mid);}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-ico{position:absolute;left:13px;font-size:15px;color:var(--soft);pointer-events:none;}
.input-wrap input{
  width:100%;padding:11px 13px 11px 38px;
  border:1.5px solid var(--mist);border-radius:13px;
  font-family:'Sarabun',sans-serif;font-size:14px;color:var(--ink);
  background:var(--white);outline:none;transition:border-color .2s,box-shadow .2s;
}
.input-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,0.12);}
.input-wrap input::placeholder{color:var(--soft);font-size:13px;}
 
.hint{font-size:11px;color:var(--soft);padding-left:2px;}
 
.row-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid);}
.row-check input{width:15px;height:15px;accent-color:var(--green);}
 
.error-msg{
  background:#FEE2E2;border:1px solid #FECACA;color:#991B1B;
  border-radius:10px;padding:9px 13px;font-size:12.5px;display:none;
}
.error-msg.show{display:block;}
 
.btn-green{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--green),var(--teal));
  color:#fff;border:none;border-radius:15px;
  font-family:'Mitr',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;letter-spacing:.5px;
  box-shadow:0 6px 20px rgba(46,204,113,0.35);
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;
}
.btn-green::after{
  content:'';position:absolute;top:-50%;left:-60%;width:50%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  transform:skewX(-20deg);animation:shimmer 3s infinite;
}
@keyframes shimmer{0%{left:-60%;}100%{left:130%;}}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(46,204,113,0.4);}
 
.links{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;}
.a-green{color:var(--green-dark);font-weight:600;text-decoration:none;}
.a-soft{color:var(--soft);}
.a-tiny{font-size:11.5px;color:var(--soft);}
 
.partner-row{display:flex;justify-content:center;gap:6px;}
.partner-chip{
  font-family:'Mitr',sans-serif;font-size:10px;font-weight:600;
  padding:3px 10px;border-radius:20px;
  border:1.5px solid var(--mist);color:var(--soft);
}
</style>
</head>
<body>
 
<div class="phone">
  <div class="status-bar">
    <span>12:54</span><span>▌▌ 5G 🔋</span>
  </div>
 
  <!-- Hero -->
  <div class="login-hero">
    <div class="hero-illustration">
      <div class="hero-blob"></div>
      <span class="bottle-float">🥤</span>
      <span class="bottle-float">♻️</span>
      <span class="bottle-float">💧</span>
      <span class="bottle-float">🥫</span>
      <div class="hero-center">
        <div class="hero-title">
          <div><span class="w1">ตู้รับคืนกระป๋องโลหะ</span></div>
          <div><span class="w2">และขวดพลาสติก</span></div>
        </div>
      </div>
    </div>
  </div>
 
  <!-- Form -->
  <div class="form-wrap">
 
    <div class="welcome">
      <h2>เข้าสู่ระบบ</h2>
      <p>ใช้รหัสนักศึกษาและรหัสผ่านของคุณ</p>
    </div>
 
    <div id="error-msg" class="error-msg"></div>
 
    <div class="field">
      <label>รหัสนักศึกษา</label>
      <div class="input-wrap">
        <input id="input-sid" type="text" placeholder="เช่น 650123456789" maxlength="12">
      </div>
      <span class="hint">กรอกรหัสนักศึกษา 12 หลัก</span>
    </div>
 
    <div class="field">
      <label>รหัสผ่าน</label>
      <div class="input-wrap">
        <input id="input-pass" type="password" placeholder="••••••••">
      </div>
    </div>
 
    <div class="row-check">
      <input type="checkbox" id="remember"> <span>จดจำรหัสผ่าน</span>
    </div>
 
    <button class="btn-green" onclick="doLogin()">เข้าสู่ระบบ</button>
 
    <div class="links">
      <div><span class="a-soft">ยังไม่มีบัญชี? </span><a href="register.html" class="a-green">ลงทะเบียนเลย</a></div>
      <a href="#" class="a-green">ลืมรหัสผ่าน?</a>
      <a class="a-tiny">อ่านนโยบายความเป็นส่วนตัว</a>
    </div>
 
    <div class="partner-row">
      <span class="partner-chip">RMUTK</span>
    </div>
  </div>
</div>
 
<script>
  function doLogin() {
    const sid  = document.getElementById('input-sid').value.trim();
    const pass = document.getElementById('input-pass').value.trim();
    const err  = document.getElementById('error-msg');
 
    if (sid.length !== 12 || !/^\d+$/.test(sid)) {
      err.textContent = '⚠️ กรุณากรอกรหัสนักศึกษาให้ครบ 12 หลัก (ตัวเลขเท่านั้น)';
      err.classList.add('show'); return;
    }
    if (!pass) {
      err.textContent = '⚠️ กรุณากรอกรหัสผ่าน';
      err.classList.add('show'); return;
    }
    err.classList.remove('show');
 
    const username = '@std_' + sid.slice(-6);
    localStorage.setItem('reborn_student_id', sid);
    localStorage.setItem('reborn_username', username);
    window.location.href = 'home.html';
  }
 
  document.getElementById('input-sid').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('input-pass').focus();
  });
  document.getElementById('input-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
